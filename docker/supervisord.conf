[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stderr_logfile=/var/log/php-fpm.log
stdout_logfile=/var/log/php-fpm.log

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90 --backoff=5
user=appuser
numprocs=%(ENV_QUEUE_WORKERS)s
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=95
priority=20
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/queue-worker.log
stdout_logfile=/var/log/queue-worker.log

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=appuser
autostart=true
autorestart=true
startsecs=5
priority=20
stderr_logfile=/var/log/scheduler.log
stdout_logfile=/var/log/scheduler.log

