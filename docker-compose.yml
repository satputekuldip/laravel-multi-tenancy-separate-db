  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - city-app-network
  #   ports:
  #     - "${DB_PORT:-5432}:5432"

  # Optional: Redis for caching/queues
  # redis:
  #   image: redis:7-alpine
  #   container_name: city-app-redis
  #   restart: unless-stopped
  #   networks:
